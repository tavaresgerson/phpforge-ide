#Splash — PHPForge IDE splash (640x360, brand asset phpforge-splash.png)
#NOI18N
SPLASH_WIDTH=640
#NOI18N
SPLASH_HEIGHT=360

#NOI18N
SplashShowProgressBar=true

# x, y, w, h — aligned with the progress placeholder in the splash artwork
#NOI18N
SplashRunningTextBounds=66, 292, 508, 14
#NOI18N
SplashProgressBarBounds=66, 321, 508, 4
#16986: Special font size used only for splash screen
#NOI18N
SplashRunningTextFontSize=10
# RGB
#NOI18N
SplashRunningTextColor=0x9A9A9A
#NOI18N
SplashProgressBarColor=0x1DD6B4
#NOI18N
SplashProgressBarEdgeColor=0x1DD6B4
#NOI18N
SplashProgressBarCornerColor=0x161616
# x, y, w, h
#NOI18N
AboutTextBounds=66, 292, 508, 14
# Hexadecimal color of printing text in RGB
#NOI18N
AboutTextColor=0xF5F5F5

###################
# Version string on the splash screen:
#NOI18N
SplashVersionTextBounds=340, 24, 234, 16
#NOI18N
SplashVersionTextFontSize=11
#NOI18N
SplashVersionTextFontType=Dialog
#NOI18N
SplashVersionTextColor=0xF5F5F5
SplashVersionTextHorizontalAlignment=right
###################

LBL_splash_window_title=Starting PHPForge IDE
currentVersion=PHPForge IDE @@metabuild.ComputedSplashVersion@@
AWT_AppClassName=PHPForge IDE @@metabuild.ComputedTitleVersion@@

MSG_warning=PHPForge IDE - Warning
MSG_info=PHPForge IDE - Information
