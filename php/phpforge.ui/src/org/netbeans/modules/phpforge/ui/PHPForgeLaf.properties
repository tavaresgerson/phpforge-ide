# PHPForge Dark — custom FlatLaf defaults
# Interface profunda estilo JetBrains New UI (Dark) para o PHPForge IDE.
# Variables (@xxx) can be referenced with $xxx in other keys.

# ---- paleta JetBrains New UI Dark ----
@background = #2B2D30
@foreground = #DFE1E5
@selection = #3574F0
@selectionText = #FFFFFF
@selectionInactive = #2E436E
@disabled = #7A7E85
@border = #323438
@component = #3C3F41
@hover = #35373B
@accent = #1DD6B4
@editor = #2B2B2B

# ---- componentes base ----
Component.arc = 4
Button.arc = 4
Component.focusWidth = 1
Component.borderColor = #323438
TextComponent.arc = 4

# ---- menu bar: funde visualmente com a toolbar (New UI não tem barra de menus separada) ----
MenuBar.background = #2B2D30
MenuBar.border =
Menu.background = #2B2D30
Menu.foreground = #DFE1E5
Menu.selectionBackground = #2E436E
Menu.selectionForeground = #DFE1E5
MenuItem.background = #2B2D30
MenuItem.selectionBackground = #2E436E
MenuItem.selectionForeground = #DFE1E5
CheckBoxMenuItem.selectionBackground = #2E436E
RadioButtonMenuItem.selectionBackground = #2E436E
PopupMenu.background = #2B2D30
PopupMenu.borderColor = #323438
PopupMenu.arc = 8
MenuItem.margin = 6,14,6,14
Menu.margin = 6,14,6,14
Menu.iconTextGap = 10

# ---- toolbar: faixa única sem bordas ----
ToolBar.background = #2B2D30
ToolBar.borderColor = #2B2D30
ToolBar.gripColor = #2B2D30
ToolBar.separatorColor = #323438
ToolBar.foreground = #DFE1E5
Button.toolbar.background = #2B2D30
Button.toolbar.hoverBackground = #3C3F41
Button.toolbar.foreground = #DFE1E5

# ---- separadores quase invisíveis ----
SplitPane.dividerSize = 1
SplitPaneDivider.gripDotCount = 0
Separator.foreground = #323438

# ---- scrollbar New UI: thumb arredondado, sem track ----
ScrollBar.width = 10
ScrollBar.thumbArc = 999
ScrollBar.track = #2B2D30
ScrollBar.thumb = #4E5156
ScrollBar.hoverThumbColor = #5A5D62
ScrollBar.pressedThumbColor = #6A6D72

# ---- seleção ----
TextPane.selectionBackground = #214283
TextArea.selectionBackground = #214283
TextField.selectionBackground = #214283
TextPane.caretForeground = #DFE1E5
EditorPane.caretForeground = #DFE1E5

# ---- editor: fundo Darcula, gutter integrado ----
TextPane.background = #2B2B2B
EditorPane.background = #2B2B2B
TextPane.foreground = #A9B7C6
EditorPane.foreground = #A9B7C6

# ---- campos/inputs: superfície elevada ----
TextField.background = #3C3F41
ComboBox.background = #3C3F41
Spinner.background = #3C3F41
ComboBox.selectionBackground = #2E436E
List.selectionBackground = #2E436E
List.selectionForeground = #DFE1E5
Table.selectionBackground = #2E436E
Table.selectionForeground = #DFE1E5
Tree.selectionBackground = #2E436E
Tree.selectionForeground = #DFE1E5
Tree.selectionArc = 4
Tree.paintLines = false
Tree.rowHeight = 0

# ---- abas do editor (New UI): slim, underline azul acento ----
EditorTab.background = #2B2D30
EditorTab.activeBackground = #2B2D30
EditorTab.selectedBackground = #2B2B2B
EditorTab.hoverBackground = #35373B
EditorTab.tabInsets = 5,8,5,8
EditorTab.showTabSeparators = false
EditorTab.underlineColor = #3574F0
EditorTab.inactiveUnderlineColor = #323438
EditorTab.underlineHeight = 2
TabbedContainer.editor.contentBorderColor = #323438

# abas de toolwindow (Project/Files/Services)
ViewTab.background = #2B2D30
ViewTab.activeBackground = #2B2D30
ViewTab.hoverBackground = #35373B
ViewTab.tabInsets = 4,8,4,8
ViewTab.showTabSeparators = false
ViewTab.underlineColor = #3574F0
ViewTab.inactiveUnderlineColor = #323438
ViewTab.underlineHeight = 2
TabbedContainer.view.contentBorderColor = #323438

# ---- faixa lateral de toolwindows (slide bar estilo New UI) ----
SlidingButton.selectedBackground = #2E436E
SlidingButton.hoverBackground = #35373B
SlidingButton.attentionBackground = #71461D
SlidingButton.attentionForeground = #DFE1E5

# ---- ícones de controle de aba (close etc.) ----
TabControlIcon.foreground = #9DA0A8
TabControlIcon.disabledForeground = #6E7073
TabControlIcon.close.rolloverBackground = #E55765
TabControlIcon.close.rolloverForeground = #FFFFFF

# ---- PHPForge IDE: indicador de arquivo modificado nas abas ----
EditorTab.modifiedDotColor = #1DD6B4
